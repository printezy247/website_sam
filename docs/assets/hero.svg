<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Sam Trading Platform, live XAUUSD signals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset=".55" stop-color="#0b0e14"/><stop offset="1" stop-color="#1a1607"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d76e"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#8a6d1f"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2b0"/><stop offset="1" stop-color="#e2c04a"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8922a"/><stop offset="1" stop-color="#5e4a12"/>
    </linearGradient>
    <linearGradient id="goldFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4af37"/><stop offset="1" stop-color="#7a5f18"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d4af37" stop-opacity=".55"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0"/><stop offset=".2" stop-color="#d4af37"/><stop offset="1" stop-color="#f5d76e"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="24"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
      @keyframes pulse{0%,100%{opacity:.35;r:6}50%{opacity:1;r:9}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes shimmer{0%{transform:translateX(-300px)}100%{transform:translateX(900px)}}
      @keyframes gridmove{0%{transform:translateY(0)}100%{transform:translateY(28px)}}
      @keyframes flicker{0%,100%{opacity:.9}50%{opacity:.5}}
      .bob{animation:bob 4s ease-in-out infinite}
      .bob2{animation:bob2 5s ease-in-out infinite}
      .c1{animation:bob 3.6s ease-in-out infinite}
      .c2{animation:bob2 4.4s ease-in-out infinite}
      .c3{animation:bob 5.2s ease-in-out infinite .6s}
      .dot{animation:pulse 1.6s ease-in-out infinite}
      .eq{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4s ease-out forwards}
      .shine{animation:shimmer 3.5s linear infinite}
      .grid{animation:gridmove 2.2s linear infinite}
      .tick{animation:flicker 2s ease-in-out infinite}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <!-- perspective floor grid -->
    <g opacity=".22" stroke="#d4af37" stroke-width="1">
      <g class="grid">
        <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="328" x2="1200" y2="328"/><line x1="0" y1="356" x2="1200" y2="356"/><line x1="0" y1="384" x2="1200" y2="384"/><line x1="0" y1="412" x2="1200" y2="412"/>
      </g>
      <line x1="600" y1="270" x2="600" y2="420"/><line x1="600" y1="270" x2="420" y2="420"/><line x1="600" y1="270" x2="240" y2="420"/><line x1="600" y1="270" x2="0" y2="420"/>
      <line x1="600" y1="270" x2="780" y2="420"/><line x1="600" y1="270" x2="960" y2="420"/><line x1="600" y1="270" x2="1200" y2="420"/>
    </g>
    <rect x="0" y="260" width="1200" height="60" fill="url(#bg)" opacity=".9"/>

    <!-- ambient glow -->
    <ellipse cx="880" cy="210" rx="260" ry="150" fill="url(#glow)" filter="url(#blur)"/>

    <!-- 3D gold bar (isometric), rotating slowly -->
    <g transform="translate(880 200)">
      <g class="bob">
        <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="6s" repeatCount="indefinite"/>
        <!-- shadow -->
        <ellipse cx="10" cy="72" rx="130" ry="16" fill="#000" opacity=".55" filter="url(#soft)"/>
        <!-- side (right) -->
        <polygon points="90,-10 120,-35 120,15 90,40" fill="url(#goldSide)"/>
        <!-- front -->
        <polygon points="-90,-10 90,-10 90,40 -90,40" fill="url(#goldFront)"/>
        <!-- top -->
        <polygon points="-90,-10 90,-10 120,-35 -60,-35" fill="url(#goldTop)"/>
        <polyline points="-60,-35 120,-35 120,15" fill="none" stroke="#fff6c8" stroke-opacity=".7" stroke-width="1.2"/>
        <polyline points="-90,-10 90,-10 90,40" fill="none" stroke="#fff6c8" stroke-opacity=".35" stroke-width="1"/>
        <!-- engraving -->
        <text x="0" y="22" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#4a3a0f" letter-spacing="4">XAUUSD</text>
        <text x="0" y="6" text-anchor="middle" class="mono" font-size="9" fill="#5e4a12" letter-spacing="2">999.9 FINE GOLD</text>
        <!-- shimmer sweep -->
        <clipPath id="barclip"><polygon points="-90,-10 90,-10 120,-35 120,15 90,40 -90,40"/></clipPath>
        <g clip-path="url(#barclip)"><rect class="shine" x="0" y="-60" width="50" height="160" fill="#ffffff" opacity=".28" transform="skewX(-20)"/></g>
      </g>
    </g>

    <!-- spinning 3D coin -->
    <g transform="translate(1060 120)">
      <g class="bob2">
        <ellipse cx="0" cy="0" rx="42" ry="42" fill="url(#gold)" stroke="#fff2b0" stroke-width="2">
          <animate attributeName="rx" values="42;6;42" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </ellipse>
        <text x="0" y="9" text-anchor="middle" class="sans" font-size="26" font-weight="800" fill="#3d2f08">
          <animate attributeName="opacity" values="1;0;1" dur="3.2s" repeatCount="indefinite"/>Au</text>
      </g>
    </g>

    <!-- floating candlesticks -->
    <g stroke-width="2">
      <g transform="translate(700 120)"><g class="c1"><line x1="0" y1="-40" x2="0" y2="40" stroke="#00c46a"/><rect x="-7" y="-18" width="14" height="36" rx="2" fill="#00c46a"/></g></g>
      <g transform="translate(735 150)"><g class="c2"><line x1="0" y1="-30" x2="0" y2="30" stroke="#ff4d4f"/><rect x="-7" y="-12" width="14" height="24" rx="2" fill="#ff4d4f"/></g></g>
      <g transform="translate(770 105)"><g class="c3"><line x1="0" y1="-48" x2="0" y2="46" stroke="#00c46a"/><rect x="-7" y="-26" width="14" height="52" rx="2" fill="#00c46a"/></g></g>
      <g transform="translate(1040 250)"><g class="c2"><line x1="0" y1="-28" x2="0" y2="28" stroke="#00c46a"/><rect x="-6" y="-14" width="12" height="28" rx="2" fill="#00c46a"/></g></g>
      <g transform="translate(1075 265)"><g class="c1"><line x1="0" y1="-22" x2="0" y2="22" stroke="#ff4d4f"/><rect x="-6" y="-8" width="12" height="16" rx="2" fill="#ff4d4f"/></g></g>
    </g>

    <!-- equity curve drawing itself -->
    <path class="eq" d="M40,330 C120,320 160,300 220,290 S330,300 380,260 S470,250 520,230 S600,240 640,200 S720,190 760,170 S840,180 900,150 S1000,130 1060,110 S1140,100 1180,80" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
    <circle class="dot" cx="1180" cy="80" r="7" fill="#f5d76e"/>

    <!-- brand text -->
    <g transform="translate(60 120)">
      <g transform="translate(0 -46)">
        <circle cx="22" cy="22" r="20" fill="none" stroke="#d4af37" stroke-opacity=".35" stroke-width="3"/>
        <circle cx="22" cy="22" r="20" fill="none" stroke="#f5d76e" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 86">
          <animateTransform attributeName="transform" type="rotate" from="0 22 22" to="360 22 22" dur="3s" repeatCount="indefinite"/>
        </circle>
        <rect x="19" y="8" width="6" height="28" rx="2" fill="#d4af37"/>
        <text x="58" y="34" class="sans" font-size="38" font-weight="800" fill="#f3f4f6" letter-spacing="-1">Sam<tspan fill="#d4af37">.</tspan></text>
      </g>
      <text x="0" y="54" class="sans" font-size="46" font-weight="700" fill="#f3f4f6" letter-spacing="-1.5">Gold signals,</text>
      <text x="0" y="104" class="sans" font-size="46" font-weight="700" fill="url(#gold)" letter-spacing="-1.5">fully transparent.</text>
      <text x="0" y="146" class="sans" font-size="18" fill="#9aa3b2">Live XAUUSD setups · auto TP/SL tally · public track record · Bahasa Melayu &amp; English</text>
      <!-- pills -->
      <g transform="translate(0 176)" class="mono" font-size="13">
        <rect x="0" y="0" width="118" height="30" rx="15" fill="none" stroke="#00c46a" stroke-opacity=".6"/><circle class="dot" cx="18" cy="15" r="5" fill="#00c46a"/><text x="32" y="19" fill="#00c46a">LIVE 5 min</text>
        <rect x="130" y="0" width="150" height="30" rx="15" fill="none" stroke="#d4af37" stroke-opacity=".6"/><text x="145" y="19" fill="#d4af37">HFM IB · $0 door</text>
        <rect x="292" y="0" width="128" height="30" rx="15" fill="none" stroke="#26A5E4" stroke-opacity=".6"/><text x="307" y="19" fill="#26A5E4">Telegram bot</text>
      </g>
    </g>

    <!-- ticker strip -->
    <g transform="translate(0 388)" class="mono" font-size="13" opacity=".85">
      <rect width="1200" height="32" fill="#0b0e14" opacity=".9"/>
      <g class="tick">
        <text x="30" y="21" fill="#9aa3b2">XAUUSD <tspan fill="#00c46a">4,467.10 ▲</tspan></text>
        <text x="230" y="21" fill="#9aa3b2">XAGUSD <tspan fill="#ff4d4f">52.18 ▼</tspan></text>
        <text x="410" y="21" fill="#9aa3b2">DXY <tspan fill="#00c46a">98.42 ▲</tspan></text>
        <text x="560" y="21" fill="#9aa3b2">US30 <tspan fill="#00c46a">46,120 ▲</tspan></text>
        <text x="740" y="21" fill="#9aa3b2">NAS100 <tspan fill="#ff4d4f">24,988 ▼</tspan></text>
        <text x="920" y="21" fill="#9aa3b2">BTCUSD <tspan fill="#00c46a">118,450 ▲</tspan></text>
        <text x="1170" y="21" text-anchor="end" fill="#6b7280" font-size="11">Yahoo</text>
      </g>
      
    </g>
    <rect width="1200" height="420" rx="24" fill="none" stroke="#d4af37" stroke-opacity=".35"/>
  </g>
</svg>
